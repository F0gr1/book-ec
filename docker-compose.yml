services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: book_ec
      POSTGRES_USER: book_ec
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book_ec -d book_ec"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: migrator
    environment:
      POSTGRES_PRISMA_URL: postgresql://book_ec@postgres:5432/book_ec?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://book_ec@postgres:5432/book_ec?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
      MICROCMS_SERVICE_DOMAIN: ${MICROCMS_SERVICE_DOMAIN:-}
      MICROCMS_API_KEY: ${MICROCMS_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      POSTGRES_PRISMA_URL: postgresql://book_ec@postgres:5432/book_ec?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://book_ec@postgres:5432/book_ec?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

volumes:
  postgres-data:
